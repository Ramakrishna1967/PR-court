[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pr-court-backend"
version = "0.1.0"
description = "PR Court adversarial trial backend"
requires-python = ">=3.11"

dependencies = [
    # Web framework
    "fastapi==0.115.5",
    "uvicorn[standard]==0.32.1",
    "sse-starlette==2.1.3",
    "python-multipart==0.0.17",

    # DB – SQLite (default, zero install) or Postgres via env switch
    "sqlalchemy==2.0.36",
    "alembic==1.14.0",
    "aiosqlite==0.20.0",          # SQLite async driver (default)
    "asyncpg==0.30.0",            # Postgres async driver (opt-in)

    # LangGraph / LangChain
    "langgraph==0.2.53",
    "langchain==0.3.9",
    "langchain-core==0.3.21",
    "langchain-openai==0.2.10",
    "langchain-anthropic==0.3.0",
    "langchain-google-genai==2.0.6",
    "langchain-community==0.3.9",

    # Validation
    "pydantic==2.10.3",
    "pydantic-settings==2.6.1",

    # HTTP / utilities
    "httpx==0.28.1",
    "python-jose[cryptography]==3.3.0",
    "structlog==24.4.0",
    "python-dotenv==1.0.1",
    "anyio==4.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.24.0",
    "pytest-mock==3.14.0",
    "httpx==0.28.1",
    "ruff==0.8.3",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"
